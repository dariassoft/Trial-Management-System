version: '3.8'

services:
  # Frontend TMS
  tms-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      NUXT_PUBLIC_API_BASE: http://localhost:3000/api/v1
    depends_on:
      - tms-backend
    networks:
      - tms-network
    restart: unless-stopped

  # Backend TMS (asume que está en ../tms-backend)
  tms-backend:
    build:
      context: ../tms-backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: tms_user
      DB_PASSWORD: tms_password
      DB_NAME: tms_db
      FRONTEND_URLS: http://localhost:3001
    depends_on:
      - mysql
    networks:
      - tms-network
    restart: unless-stopped

  # MySQL Database
  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: tms_db
      MYSQL_USER: tms_user
      MYSQL_PASSWORD: tms_password
    volumes:
      - mysql-data:/var/lib/mysql
      - ../tms-backend/database.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ../tms-backend/docs/auth_seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    networks:
      - tms-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql-data:

networks:
  tms-network:
    driver: bridge

