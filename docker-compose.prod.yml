services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    environment:
      DOCKERIZED: ${DOCKERIZED:?Define DOCKERIZED in Dokploy}
      NODE_ENV: ${NODE_ENV:?Define NODE_ENV in Dokploy}
      DB_TYPE: ${DB_TYPE:?Define DB_TYPE in Dokploy}
      DB_HOST: ${DB_HOST:?Define DB_HOST in Dokploy}
      DB_PORT: ${DB_PORT:?Define DB_PORT in Dokploy}
      DB_USER: ${DB_USER:?Define DB_USER in Dokploy}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD in Dokploy}
      DB_NAME: ${DB_NAME:?Define DB_NAME in Dokploy}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET in Dokploy}
      JWT_EXPIRATION_TIME: ${JWT_EXPIRATION_TIME:?Define JWT_EXPIRATION_TIME in Dokploy}
      FRONTEND_URLS: ${FRONTEND_URLS:?Define FRONTEND_URLS in Dokploy}
    expose:
      - "3000"
    depends_on:
      mysql:
        condition: service_healthy
      mysql-init:
        condition: service_completed_successfully
    volumes:
      - uploads-data:/app/uploads
    restart: unless-stopped
    networks:
      - backend-network

  client-vue:
    build:
      context: ./tms-client-vue
      dockerfile: Dockerfile.prod
      args:
        NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:?Define NUXT_PUBLIC_API_BASE in Dokploy}
    environment:
      NODE_ENV: ${NODE_ENV:?Define NODE_ENV in Dokploy}
      HOST: ${HOST:?Define HOST in Dokploy}
      PORT: ${PORT:?Define PORT in Dokploy}
      NITRO_PORT: ${NITRO_PORT:?Define NITRO_PORT in Dokploy}
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:?Define NUXT_PUBLIC_API_BASE in Dokploy}
    expose:
      - "3000"
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped
    networks:
      - backend-network

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD in Dokploy}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Define MYSQL_DATABASE in Dokploy}
      MYSQL_USER: ${MYSQL_USER:?Define MYSQL_USER in Dokploy}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD in Dokploy}
    expose:
      - "3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    volumes:
      - mysql-data:/var/lib/mysql
      # Carga el esquema y los datos iniciales solo cuando el volumen es nuevo.
      - ./2026-09-30.nest_db.dump.sql:/docker-entrypoint-initdb.d/01-nest_db.dump.sql:ro
    restart: unless-stopped
    networks:
      - backend-network

  mysql-init:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD in Dokploy}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Define MYSQL_DATABASE in Dokploy}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./2026-09-30.nest_db.dump.sql:/seed/nest_db.dump.sql:ro
    command:
      - /bin/sh
      - -ec
      - |
        TABLE_COUNT=$$(mysql -h mysql -u root -p"$${MYSQL_ROOT_PASSWORD}" -Nse "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = '$${MYSQL_DATABASE}'")
        if [ "$${TABLE_COUNT}" = "0" ]; then
          echo "Importando el dump inicial en $${MYSQL_DATABASE}..."
          mysql -h mysql -u root -p"$${MYSQL_ROOT_PASSWORD}" "$${MYSQL_DATABASE}" < /seed/nest_db.dump.sql
        elif ! mysql -h mysql -u root -p"$${MYSQL_ROOT_PASSWORD}" -Nse "SELECT 1 FROM information_schema.tables WHERE table_schema = '$${MYSQL_DATABASE}' AND table_name = 'Laboratorio'" | grep -q 1; then
          echo "ERROR: $${MYSQL_DATABASE} contiene tablas, pero falta Laboratorio. No se importa el dump para evitar borrar datos existentes."
          exit 1
        else
          echo "Esquema existente detectado; no se importa el dump."
        fi

        mysql -h mysql -u root -p"$${MYSQL_ROOT_PASSWORD}" -Nse "SELECT 1 FROM information_schema.tables WHERE table_schema = '$${MYSQL_DATABASE}' AND table_name = 'Laboratorio'" | grep -q 1
    restart: "no"
    networks:
      - backend-network

volumes:
  mysql-data:
  uploads-data:

networks:
  backend-network:
    driver: bridge
