services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    environment:
      DOCKERIZED: "true"
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: ${DB_USER:?Define DB_USER in Dokploy}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD in Dokploy}
      DB_NAME: ${DB_NAME:?Define DB_NAME in Dokploy}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET in Dokploy}
      JWT_EXPIRATION_TIME: ${JWT_EXPIRATION_TIME:-1d}
      FRONTEND_URLS: ${FRONTEND_URLS:?Define FRONTEND_URLS in Dokploy}
    expose:
      - "3000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - uploads-data:/app/uploads
    restart: unless-stopped
    networks:
      - backend-network

  client-vue:
    build:
      context: ./tms-client-vue
      dockerfile: Dockerfile.prod
      args:
        NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:?Define NUXT_PUBLIC_API_BASE in Dokploy}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      NITRO_PORT: "3000"
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:?Define NUXT_PUBLIC_API_BASE in Dokploy}
    expose:
      - "3000"
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped
    networks:
      - backend-network

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD in Dokploy}
      MYSQL_DATABASE: ${DB_NAME:?Define DB_NAME in Dokploy}
      MYSQL_USER: ${DB_USER:?Define DB_USER in Dokploy}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD in Dokploy}
    expose:
      - "3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - backend-network

volumes:
  mysql-data:
  uploads-data:

networks:
  backend-network:
    driver: bridge
