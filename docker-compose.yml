version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      DOCKERIZED: 'true'
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: myuser
      DB_PASSWORD: mypassword
      DB_NAME: nest_db
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - .:/app
#      - /dev/null:/tms-client-vue
#      - /app/node_modules # Prevents host's node_modules from overwriting container's
    restart: always

  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: mypassword
      MYSQL_DATABASE: nest_db
      MYSQL_USER: myuser
      MYSQL_PASSWORD: mypassword
    ports:
      - '3306:3306'
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      # Persist database data to avoid data loss on container removal
      - mysql-data:/var/lib/mysql

  client-vue:
    build:
      context: ./tms-client-vue
      dockerfile: Dockerfile
    working_dir: /app
    ports:
      - '3001:3001'
    volumes:
      - ./tms-client-vue:/app:delegated
      - client_node_modules:/app/node_modules
    environment:
      - HOST=0.0.0.0
      - NUXT_PUBLIC_API_BASE_URL=http://app:3000
      - NODE_ENV=development
    depends_on:
      - app
    restart: always

volumes:
  mysql-data:
  client_node_modules: